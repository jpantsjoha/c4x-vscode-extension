name: CI

on:
  # Actions-spend reduction: docs-only pushes skip CI entirely, and the
  # expensive jobs (cve-scan, e2e-browser, package) are gated to pull requests
  # and release tags. Caveat: paths-ignore also applies to tag pushes, so a
  # release tag placed on a docs-only commit will not build. Release commits
  # bump package.json, so this does not arise in the normal flow.
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  C4X_VSCODE_VERSION: '1.128.0'

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.20.2', '26.5.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tracked MCP artifacts
        run: pnpm run verify:mcp

      - name: Test MCP protocol
        run: pnpm run test:mcp

      - name: Lint code
        run: pnpm run lint

      - name: Build extension
        run: pnpm run build

      - name: Compile TypeScript
        run: pnpm run test:compile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run extension-host tests
        if: matrix.node-version == '20.20.2'
        run: xvfb-run -a pnpm test

      - name: Run performance regression gate
        if: matrix.node-version == '20.20.2'
        run: pnpm run bench

      - name: Generate coverage evidence
        if: matrix.node-version == '20.20.2'
        run: pnpm run coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/

  # ---------------------------------------------------------------------------
  # CVE scan via osv-scanner (Google Open Source Vulnerabilities database).
  #
  # Report-only: advisories are surfaced as a build artifact and in the step
  # summary, but findings do NOT fail the pipeline (continue-on-error: true).
  # The known high advisories are in devDependencies only (build tooling such
  # as @vscode/vsce, esbuild, and Playwright); they do not ship in the VSIX.
  # Triage status is tracked in docs/adrs/TDR-007-security-audit.md.
  #
  # To harden this job into a blocking gate once all highs are triaged/fixed:
  #   1. Remove continue-on-error.
  #   2. Drop `|| true` from the osv-scanner invocation.
  #   3. Update TDR-007 status to ENFORCED.
  # ---------------------------------------------------------------------------
  cve-scan:
    name: CVE Scan (osv-scanner, report-only)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install osv-scanner
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Scan lockfile for known CVEs (table report)
        id: scan
        run: |
          osv-scanner scan --lockfile pnpm-lock.yaml 2>&1 | tee osv-scan-report.txt || true
          echo "## CVE Scan Summary (osv-scanner v2.3.8)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(Total|[0-9]+ vulnerabilities)" osv-scan-report.txt >> $GITHUB_STEP_SUMMARY || tail -3 osv-scan-report.txt >> $GITHUB_STEP_SUMMARY || echo "(no findings)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "See [TDR-007](docs/adrs/TDR-007-security-audit.md) for triage status." >> $GITHUB_STEP_SUMMARY

      - name: Scan lockfile for known CVEs (SARIF artifact)
        run: |
          osv-scanner scan --lockfile pnpm-lock.yaml --format sarif --output-file osv-scan-results.sarif || true

      - name: Upload CVE scan results (SARIF)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cve-scan-results
          path: |
            osv-scan-results.sarif
            osv-scan-report.txt
          retention-days: 30

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: '20.20.2'
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Documentation
        run: pnpm run validate:docs

  # ---------------------------------------------------------------------------
  # Playwright E2E browser suite (61 scenarios: visual-layout, visual-c4-editor,
  # zoom-fit-multiselect, markdown-entry, basic, perf-large-diagram)
  #
  # The specs run against a static HTML harness (no live VS Code process), so
  # xvfb is NOT required — Chromium runs headless. The harness is auto-generated
  # by test.beforeAll() inside each spec via generate-prototype-harness.js.
  #
  # Snapshot policy: the golden (visual-c4-editor-chrome-chromium-darwin.png)
  # was captured on macOS. maxDiffPixelRatio=0.05 in playwright.config.ts
  # absorbs Linux font/antialiasing differences. Once this job has been green
  # for 5 consecutive CI runs, regenerate goldens on Linux, tighten the ratio
  # to 0.02, and flip continue-on-error to false to make the job required.
  # ---------------------------------------------------------------------------
  e2e-browser:
    name: Playwright E2E (chromium, report-only)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # Report-only: failures are surfaced in the artifact but do not block the
    # pipeline. Flip to false after 5 consecutive green runs (see note above).
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser + OS deps
        # Must use @playwright/test's own CLI (the version the specs run with).
        # `pnpm exec playwright` resolves the separate `playwright` package,
        # which pins a different browser build and leaves the runner without
        # the headless shell it expects.
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build extension (required for harness generation)
        run: pnpm run build

      - name: Compile TypeScript (harness generator uses ts-node)
        run: pnpm run test:compile

      - name: Run Playwright E2E suite
        run: pnpm run test:e2e
        env:
          C4X_PLAYWRIGHT_OUTPUT_DIR: playwright-test-results

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: playwright-test-results/
          retention-days: 14

  package:
    name: Package & Clean VSIX Smoke (${{ matrix.os }})
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    needs: [build-and-test, validate-docs]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: '20.20.2'
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cross-platform unit tests
        run: pnpm run test:unit

      - name: Package, install and smoke test VSIX (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:vsix-smoke

      - name: Package, install and smoke test VSIX
        if: runner.os != 'Linux'
        run: pnpm run test:vsix-smoke

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c4x-vsix-${{ runner.os }}
          path: "*.vsix"
          retention-days: 7

  deploy:
    name: Publish to Marketplace
    runs-on: ubuntu-24.04
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: '20.20.2'
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tag matches Package Version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Error: Git tag ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            echo "Please ensure you bumped the version in package.json before tagging."
            exit 1
          fi
          echo "✅ Version verified: $PACKAGE_VERSION"

      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: c4x-vsix-Linux

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
