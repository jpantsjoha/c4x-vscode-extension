name: CI

on:
  # Product checks run for PRs, release tags and code pushes.
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  C4X_VSCODE_VERSION: '1.128.0'

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.20.2', '26.5.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical quick checks
        run: make quick-check

      - name: Build extension
        run: pnpm run build

      - name: Run extension-host tests
        if: matrix.node-version == '20.20.2'
        run: xvfb-run -a pnpm test

      - name: Run performance regression gate
        if: matrix.node-version == '20.20.2'
        run: pnpm run bench

      - name: Generate coverage evidence
        if: matrix.node-version == '20.20.2'
        run: pnpm run coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/

  # The complete dependency graph is audited: some development dependencies
  # are embedded in the standalone MCP distribution.
  cve-scan:
    name: Dependency security gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
      - name: Audit all locked dependencies
        run: make cve-scan

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: '20.20.2'
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Documentation
        run: pnpm run validate:docs

  # Execute the real preview script and enforce visual/interaction regressions.
  e2e-browser:
    name: Playwright E2E (chromium)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser + OS deps
        # Must use @playwright/test's own CLI (the version the specs run with).
        # `pnpm exec playwright` resolves the separate `playwright` package,
        # which pins a different browser build and leaves the runner without
        # the headless shell it expects.
        run: node ./node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build extension (required for harness generation)
        run: pnpm run build

      - name: Compile TypeScript (harness generator uses ts-node)
        run: pnpm run test:compile

      - name: Run Playwright E2E suite
        run: pnpm run test:e2e
        env:
          C4X_PLAYWRIGHT_OUTPUT_DIR: playwright-test-results

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: playwright-test-results/
          retention-days: 14

  package:
    name: Package & Clean VSIX Smoke (${{ matrix.os }})
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ${{ matrix.os }}
    needs: [build-and-test, validate-docs]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm must be installed before setup-node, because `cache: 'pnpm'`
      # resolves the store path by shelling out to `pnpm store path`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.18.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'pnpm'

      - name: Validate and record pinned toolchain
        env:
          C4X_EXPECTED_NODE_VERSION: '20.20.2'
        run: pnpm run validate:toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cross-platform unit tests
        run: pnpm run test:unit

      - name: Package, install and smoke test VSIX (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:vsix-smoke

      - name: Package, install and smoke test VSIX
        if: runner.os != 'Linux'
        run: pnpm run test:vsix-smoke

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c4x-vsix-${{ runner.os }}
          path: "*.vsix"
          retention-days: 7

# The publish job that used to live here has moved to release.yml.
#
# Both workflows triggered on `v*` tags, so a single release fired two
# publishes: whichever lost the race failed with "already exists", producing a
# red run for a release that had actually succeeded. release.yml is now the one
# publish path — no path filter, self-contained, and retryable via
# workflow_dispatch without moving a tag.
