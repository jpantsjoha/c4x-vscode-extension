<head>

    <style>
        /* Base styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
            background: #fff;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }

        h1 { border-bottom: 2px solid #eee; padding-bottom: 0.3em; }
        h2 { border-bottom: 1px solid #eee; padding-bottom: 0.3em; }

        /* Code blocks */
        code {
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 85%;
        }

        pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }

        pre code {
            background: transparent;
            padding: 0;
        }

        /* Links */
        a {
            color: #0366d6;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Tables */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background: #f6f8fa;
            font-weight: 600;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid #ddd;
            padding-left: 16px;
            margin-left: 0;
            color: #666;
        }

        /* C4X Diagram Styles */
        /**
 * C4X Markdown Diagram Styles
 * Styles for C4X diagrams rendered in Markdown preview
 */

/* Container for successfully rendered diagrams */
.c4x-diagram {
    margin: 20px 0;
    padding: 16px;
    background: var(--vscode-editor-background, #ffffff);
    border: 1px solid var(--vscode-panel-border, #e5e7eb);
    border-radius: 8px;
    text-align: center;
    overflow-x: auto;
}

.c4x-diagram svg {
    /* Fill the wrapper, which caps width at the diagram's intrinsic size
       (inline max-width) — scales down to fit, never upscales. */
    width: 100%;
    height: auto;
    display: inline-block;
}

/* Error display */
.c4x-error {
    margin: 20px 0;
    padding: 16px;
    background: var(--vscode-inputValidation-errorBackground, #fee);
    border: 2px solid var(--vscode-inputValidation-errorBorder, #dc2626);
    border-radius: 8px;
    color: var(--vscode-errorForeground, #dc2626);
    font-family: var(--vscode-font-family, monospace);
}

.c4x-error-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.c4x-error-header strong {
    font-size: 14px;
    font-weight: 600;
}

.c4x-error-message {
    margin: 0;
    padding: 12px;
    background: var(--vscode-editor-background, #fff);
    border: 1px solid var(--vscode-inputValidation-errorBorder, #fca5a5);
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* Placeholder for async rendering */
.c4x-diagram-placeholder {
    margin: 20px 0;
    padding: 32px 16px;
    background: var(--vscode-editor-background, #f9fafb);
    border: 2px dashed var(--vscode-panel-border, #cbd5e0);
    border-radius: 8px;
    text-align: center;
}

.c4x-placeholder-content {
    max-width: 400px;
    margin: 0 auto;
}

.c4x-placeholder-content svg {
    margin-bottom: 16px;
    opacity: 0.6;
}

.c4x-placeholder-content p {
    margin: 8px 0;
    color: var(--vscode-foreground, #374151);
}

.c4x-placeholder-content strong {
    font-size: 16px;
}

.c4x-placeholder-stats {
    font-size: 14px;
    color: var(--vscode-descriptionForeground, #6b7280);
}

.c4x-placeholder-note {
    font-size: 12px;
    font-style: italic;
    color: var(--vscode-descriptionForeground, #9ca3af);
    margin-top: 12px !important;
}

/* Dark theme adjustments */
.vscode-dark .c4x-diagram,
.vscode-high-contrast .c4x-diagram {
    background: var(--vscode-editor-background, #1e1e1e);
    border-color: var(--vscode-panel-border, #3e3e42);
}

.vscode-dark .c4x-error,
.vscode-high-contrast .c4x-error {
    background: var(--vscode-inputValidation-errorBackground, #3f1f1f);
    border-color: var(--vscode-inputValidation-errorBorder, #dc2626);
}

.vscode-dark .c4x-error-message,
.vscode-high-contrast .c4x-error-message {
    background: var(--vscode-editor-background, #1e1e1e);
    border-color: var(--vscode-inputValidation-errorBorder, #7f1d1d);
}

/* Print styles for PDF/Print Preview */
@media print {
    .c4x-diagram {
        page-break-inside: avoid;
        background: white !important;
        border: 1px solid #000 !important;
        padding: 16px;
        margin: 20px 0;
    }
    
    .c4x-diagram svg {
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
    }
    
    /* Hide error displays in print */
    .c4x-error {
        background: #fee !important;
        border: 2px solid #dc2626 !important;
        color: #000 !important;
        page-break-inside: avoid;
    }
    
    /* Hide placeholders in print */
    .c4x-diagram-placeholder {
        display: none;
    }
    
    /* Ensure text is readable */
    .c4x-error-message {
        color: #000 !important;
        background: #fff !important;
    }
}


        /* Print styles */
        @media print {
            body {
                max-width: 100%;
                padding: 0;
            }

            .c4x-diagram {
                page-break-inside: avoid;
                background: white !important;
                border: 1px solid #000 !important;
            }

            .c4x-diagram svg {
                max-width: 100% !important;
                height: auto !important;
            }

            /* Hide error placeholders in print */
            .c4x-diagram-placeholder {
                display: none;
            }
        }
    </style>
</head>
